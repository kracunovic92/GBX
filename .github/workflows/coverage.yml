name: Coverage
on:
    push:
        branches: [ main ]
    workflow_dispatch:

jobs:
    coverage:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@master
              with: { toolchain: 1.85.0 }
            - run: bash scripts/coverage.sh
            - uses: actions/upload-artifact@v4
              with:
                  name: lcov
                  path: coverage/lcov.info
