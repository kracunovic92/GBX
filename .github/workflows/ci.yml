name: CI
on:
    push:
    pull_request:

jobs:
    build-test:
        name: build + fmt + clippy + test (${{ matrix.toolchain }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                toolchain: [ "1.85.0", "stable" ]

        steps:
            -   uses: actions/checkout@v4

            -   uses: dtolnay/rust-toolchain@master
                with:
                    toolchain: ${{ matrix.toolchain }}
                    components: clippy, rustfmt

            -   uses: Swatinem/rust-cache@v2
                with:
                    workspaces: "./ -> target"

            # Formatting (only needs one toolchain; but running on both is fine & simple)
            -   run: cargo fmt --all -- --check

            # Lints
            -   run: cargo clippy --workspace --all-targets --all-features -- -D warnings

            # Tests (exclude Criterion bench binaries; benches run in the separate job below)
            -   run: cargo test --workspace --lib --bins --tests --all-features -- --test-threads=1

            # Optional but recommended: ensure docs build without warnings (broken links, etc.)
            -   run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features

    benches:
        name: benches (compile/run) non-blocking
        runs-on: ubuntu-latest
        if: github.event_name == 'push'

        steps:
            -   uses: actions/checkout@v4

            -   uses: dtolnay/rust-toolchain@master
                with:
                    toolchain: stable

            -   uses: Swatinem/rust-cache@v2
                with:
                    workspaces: "./ -> target"

            # Keep non-blocking (benches can be flaky/noisy on shared runners).
            # `--quick` gives a smoke signal while full local runs keep the
            # statistically useful history in target/criterion.
            -   run: cargo bench --workspace -- --quick
                continue-on-error: true

            -   uses: actions/upload-artifact@v4
                if: always()
                with:
                    name: criterion-reports
                    path: target/criterion
                    if-no-files-found: ignore
