name: CI
on:
    push:
    pull_request:

jobs:
    build-test:
        name: build + fmt + clippy + test (${{ matrix.toolchain }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                toolchain: [ "1.85.0", "stable" ]

        steps:
            -   uses: actions/checkout@v4

            -   uses: dtolnay/rust-toolchain@master
                with:
                    toolchain: ${{ matrix.toolchain }}
                    components: clippy, rustfmt

            -   uses: Swatinem/rust-cache@v2
                with:
                    workspaces: "./ -> target"

            # Formatting (only needs one toolchain; but running on both is fine & simple)
            -   run: cargo fmt --all -- --check

            # Lints
            -   run: cargo clippy --workspace --all-targets --all-features -- -D warnings

            # Tests (include examples/integration tests by using --all-targets)
            -   run: cargo test --workspace --all-targets --all-features

            # Optional but recommended: ensure docs build without warnings (broken links, etc.)
            -   run: cargo doc --workspace --no-deps --all-features -D warnings

    benches:
        name: benches (compile/run) non-blocking
        runs-on: ubuntu-latest
        if: github.event_name == 'push'

        steps:
            -   uses: actions/checkout@v4

            -   uses: dtolnay/rust-toolchain@master
                with:
                    toolchain: stable

            -   uses: Swatinem/rust-cache@v2
                with:
                    workspaces: "./ -> target"

            # Keep non-blocking (benches can be flaky/noisy on shared runners)
            -   run: cargo bench --workspace
                continue-on-error: true
