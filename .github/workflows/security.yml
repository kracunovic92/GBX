name: Security
on:
    schedule: [{ cron: "0 6 * * 1" }] # weekly
    workflow_dispatch:

jobs:
    audit-deny:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@master
              with: { toolchain: 1.85.0 }
            - run: cargo install cargo-audit cargo-deny
            - run: cargo audit
            - run: cargo deny check
