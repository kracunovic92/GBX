[package]
name = "gbx-alg"
version = "0.1.0"
description = "Foundational algebraic traits and law-checking helpers for the GBX ecosystem."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

keywords = ["algebra", "ring", "field", "math"]
categories = ["mathematics", "science", "no-std"]

[features]
default = ["std"]
std = []
laws = ["std"]

[dependencies]

[dev-dependencies]
criterion = { version = "0.8.1", features = ["html_reports"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "bench"
harness = false
