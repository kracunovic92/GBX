[package]
name = "algebra_poly"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Multivariate polynomials over abstract fields from algebra_core."
keywords = ["algebra", "polynomial", "grobner", "field", "math"]
categories = ["science", "algorithms"]

[dependencies]
algebra_core.workspace = true
algebra_field.workspace = true

[features]
default = ["std"]
std = []

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["std"]
no-default-features = true
rustdoc-args = ["--cfg", "docsrs"]

