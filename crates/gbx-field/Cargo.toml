[package]
name = "gbx-field"
version = "0.1.0"
description = "Concrete field implementations for the GBX ecosystem (e.g. Zp, Fp)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

keywords = ["algebra", "field", "finite-field", "math"]
categories = ["mathematics", "science", "no-std"]

[features]
default = ["std", "zp", "fp", "prime-check"]

std = ["gbx-alg/std"]

zp = []
fp = ["zp"]

prime-check = ["std", "fp"]

panic-div = []

laws = ["gbx-alg/laws"]

[dependencies]
gbx-alg = { path = "../gbx-alg", default-features = false }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.8.1", features = ["html_reports"] }

[lints]
workspace = true

[[bench]]
name = "bench"
harness = false
