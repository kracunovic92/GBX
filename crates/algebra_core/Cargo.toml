[package]
name = "algebra_core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords = ["algebra", "ring", "field", "polynomial", "math"]
categories = ["science", "data-structures", "algorithms"]

description = "Foundational algebraic traits + law-test helpers (no foreign impls)."
readme = "README.md"


[features]
default = ["std"]
std = []

[lints]
workspace = true

[dev-dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[package.metadata.docs.rs]
features = ["std"]
no-default-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
criterion = "0.8.1"

[[bench]]
name = "additive_vs_mul"
harness = false
